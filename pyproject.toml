[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "salesbench-100"
version = "3.2.0"
description = "Deterministic long-horizon sales-agent benchmark across Salesforce, HubSpot, Gong, and RevOps workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Blobfish AI" }]
dependencies = []

[project.scripts]
salesbench-build = "salesbench.builder:main"
salesbench-run = "salesbench.run_suite:main"

[tool.setuptools.packages.find]
include = ["salesbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
